services:
  gcs-filedownload-page:
    build: .
    image: ${IMAGE_NAME:-gcs-filedownload-page}:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-gcs-filedownload-page}
    init: true
    restart: unless-stopped
    environment:
      BUCKET_NAMES: ${BUCKET_NAMES:?Set BUCKET_NAMES in .env}
      LOGIN_USERNAME: "${LOGIN_USERNAME:-admin}"
      LOGIN_PASSWORD: "${LOGIN_PASSWORD:-#cloud01}"
      SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-8}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-service-account.json
      PORT: "8080"
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS_HOST_PATH:?Set GOOGLE_APPLICATION_CREDENTIALS_HOST_PATH in .env}:/run/secrets/gcp-service-account.json:ro
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8080}:8080
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
